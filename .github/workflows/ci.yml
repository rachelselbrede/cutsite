name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Every push to every branch runs the suite, so a branch is checked
    # before anyone opens a pull request for it. A pull request from a
    # branch in this repository would then run twice, so the pull_request
    # event is kept for forks, whose pushes cannot run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript parses
        run: |
          node --check script.js
          node --check tests/suite.js

      # cutsite-standalone.html is generated. It silently fell three features
      # behind when it was maintained by hand, so the build refuses to drift.
      - name: Check the standalone build is current
        run: python3 build-standalone.py --check

      - name: Show the browser version under test
        run: google-chrome --version

      - name: Run the test suite
        run: python3 tests/run.py
